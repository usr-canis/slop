; Desktop Head Unit config for testing Telltale.
; Run:  ./desktop-head-unit -c /path/to/telltale-headunit.ini
[general]
; Pretend to be a plug-in hybrid so energy profile shows fuel + EV data.
; Fuel type codes: 1 = unleaded, 10 = electric. EV connector codes: 5 = CCS2 (Combo 2), 2 = Mennekes.
fueltypes = 1,10
evconnectors = 5,2

[sensors]
accelerometer = true
compass = true
driving_status = true
fuel = true
gyroscope = true
location = true
night_mode = true
odometer = true
speed = true
toll_card = true
gps_satellite = true
parking_brake = true
gear = true
